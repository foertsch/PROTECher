[project]
name = "design-pipeline"
version = "0.2.0"
description = "Antibody affinity maturation: get a structure, score every variant, gate, pair."
readme = "README.md"
requires-python = ">=3.11"
# Every run needs these and they are all light. No torch, no jax: importing
# design_pipeline must not import a model.
dependencies = [
    "numpy>=1.26",
    # 2.0 changed superimpose() to return a transformation; scoring relies on it.
    "biotite>=2.0",
    # The variant table. pandas rather than polars because the analysis the
    # harness output gets handed to afterwards is pandas, and this package
    # already spoke it.
    "pandas>=2.0",
    # pandas writes parquet through one of these; pyarrow is the one that is
    # actually maintained for it.
    "pyarrow>=15",
]

[project.optional-dependencies]
# IMGT position labels. An extra rather than a core dependency because ANARCI
# needs HMMER on PATH, which is awkward on a laptop and awkward in CI. Without
# it the `imgt` column is empty and a warning says so; nothing else changes,
# because every join in this package is on chain positions.
numbering = ["anarci"]
# Container adapters (the scorers, the gate checks, rfdiffusion) need no Python
# dependency at all.
#
# The four co-folding models are one extra each: all need Linux and a CUDA GPU,
# they pin torch against each other, and a campaign uses one or two of them.
# Chai-1 is the default. Its adapter calls run_inference in process (the CLI
# drops the PAE matrix), so the minor is pinned.
chai = ["chai_lab>=0.6,<0.7"]
# Boltz-2. [cuda] is the tool's own GPU extra.
boltz = ["boltz[cuda]>=2.2,<3"]
# Pinned, not ranged: this is the version whose LICENSE and README the model
# table in README.md reports, and the licensing of the weights is unresolved.
protenix = ["protenix==2.0.0"]
colabfold = ["colabfold[alphafold]>=1.5"]
# ProteinMPNN / LigandMPNN / SolubleMPNN, parameters bundled in the wheel.
# Heads-up: ligandmpnn 0.1.2 pins numpy==1.23.5, torch==2.2.1 and Python <3.12,
# which conflicts with biotite's numpy>=2.1. Installing this extra alongside the
# core may not resolve; the adapter shells out, so the supported fallback is a
# separate environment plus `executable="/path/to/env/bin/ligandmpnn"`.
mpnn = ["ligandmpnn>=0.1.2"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["design_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite runs without ANARCI - it needs HMMER, which is why it is an extra -
# and the degradation warning on every variant table would drown the output.
# The tests that care assert the empty `imgt` column directly.
filterwarnings = ["ignore:anarci is not installed:RuntimeWarning"]
